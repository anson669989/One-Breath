plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onebreath.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.onebreath.app'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.1'
    }

    // 正式版簽章：金鑰不放在 repo 裡，由環境變數提供（GitHub Actions 從 Secrets 帶入）。
    // 沒設定環境變數時（例如在自己電腦上試建），release 會是未簽章的 APK。
    def keystorePath = System.getenv('KEYSTORE_FILE')
    def hasKeystore = keystorePath != null && file(keystorePath).exists()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'onebreath'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 沒有任何第三方函式庫，只用 Android 內建 API
dependencies {
}

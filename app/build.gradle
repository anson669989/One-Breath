plugins {
    id 'com.android.application'
}

android {
    namespace 'com.onebreath.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.onebreath.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 沒有任何第三方函式庫，只用 Android 內建 API
dependencies {
}
